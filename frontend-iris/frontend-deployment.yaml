apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-iris
  namespace: kserve-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-iris
  template:
    metadata:
      labels:
        app: frontend-iris
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-files
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html-files
        configMap:
          name: frontend-files
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: kserve-test
spec:
  selector:
    app: frontend-iris
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
