apiVersion: v1
data:
  app.js: "/**\n * Mapping species classes returned by KServe Model\n * Assuming Scikit-Learn
    RandomForest output where:\n * 0 = Setosa\n * 1 = Versicolor\n * 2 = Virginica\n
    */\nconst SPECIES_MAP = {\n    0: { name: 'Iris Setosa', emoji: '\U0001F338',
    theme: 'theme-setosa' },\n    1: { name: 'Iris Versicolor', emoji: '\U0001F33A',
    theme: 'theme-versicolor' },\n    2: { name: 'Iris Virginica', emoji: '\U0001F33B',
    theme: 'theme-virginica' }\n};\n\ndocument.addEventListener('DOMContentLoaded',
    () => {\n    const form = document.getElementById('predictionForm');\n    const
    submitBtn = document.getElementById('submitBtn');\n    const loadingSpinner =
    document.getElementById('loadingSpinner');\n    const resultCard = document.getElementById('resultCard');\n
    \   const errorBanner = document.getElementById('errorBanner');\n\n    // Result
    elements\n    const flowerIcon = document.getElementById('flowerIcon');\n    const
    speciesName = document.getElementById('speciesName');\n    const classIndexEl
    = document.getElementById('classIndex');\n    const errorMessage = document.getElementById('errorMessage');\n\n
    \   // Reset UI state\n    const resetUI = () => {\n        resultCard.classList.add('hidden');\n
    \       errorBanner.classList.add('hidden');\n        document.body.className
    = ''; // Removing all theme classes\n    };\n\n    const setLoading = (isLoading)
    => {\n        submitBtn.disabled = isLoading;\n        if (isLoading) {\n            loadingSpinner.classList.remove('hidden');\n
    \           submitBtn.querySelector('span').textContent = 'Predicting...';\n            submitBtn.style.opacity
    = '0.8';\n        } else {\n            loadingSpinner.classList.add('hidden');\n
    \           submitBtn.querySelector('span').textContent = 'Predict Species';\n
    \           submitBtn.style.opacity = '1';\n        }\n    };\n\n    form.addEventListener('submit',
    async (e) => {\n        e.preventDefault();\n        resetUI();\n        setLoading(true);\n\n
    \       // 1. Get exact backend endpoint\n        // Example: http://localhost:8080/v1/models/iris:predict\n
    \       const apiUrl = document.getElementById('apiUrl').value.trim();\n\n        //
    2. Gather Features\n        const sepalLength = parseFloat(document.getElementById('sepalLength').value);\n
    \       const sepalWidth = parseFloat(document.getElementById('sepalWidth').value);\n
    \       const petalLength = parseFloat(document.getElementById('petalLength').value);\n
    \       const petalWidth = parseFloat(document.getElementById('petalWidth').value);\n\n
    \       // 3. Construct Standard KServe Protocol Payload\n        const payload
    = {\n            instances: [\n                [sepalLength, sepalWidth, petalLength,
    petalWidth]\n            ]\n        };\n\n        try {\n            // Parse
    URL to handle both absolute (local testing) and relative (cloud Native) paths\n
    \           let parsedUrl;\n            let targetHost = undefined;\n            \n
    \           // Checking if it's a relative URL (which means we are running natively
    on the ELB)\n            if (apiUrl.startsWith('/')) {\n                parsedUrl
    = new URL(apiUrl, window.location.origin);\n            } else {\n                parsedUrl
    = new URL(apiUrl);\n                targetHost = parsedUrl.hostname;\n                if
    (targetHost === 'localhost' || targetHost === '127.0.0.1') {\n                    //
    Local proxy legacy support\n                    targetHost = 'sklearn-iris.kserve-test.example.com';\n
    \               } else {\n                    targetHost = undefined;\n                }\n
    \           }\n\n            const fetchHeaders = {\n                'Content-Type':
    'application/json'\n            };\n            if (targetHost) {\n                fetchHeaders['Target-Host']
    = targetHost;\n            }\n\n            const response = await fetch(apiUrl,
    {\n                method: 'POST',\n                headers: fetchHeaders,\n                body:
    JSON.stringify(payload)\n            });\n\n            if (!response.ok) {\n
    \               let errorDetails = '';\n                try {\n                    const
    errorJson = await response.json();\n                    errorDetails = JSON.stringify(errorJson);\n
    \               } catch (e) {\n                    errorDetails = response.statusText;\n
    \               }\n                throw new Error(`HTTP Error ${response.status}:
    ${errorDetails}`);\n            }\n\n            const data = await response.json();\n\n
    \           // 5. Parse output strictly following {\"predictions\": [...]}\n            //
    Example response: {\"predictions\": [1]}\n            if (!data.predictions ||
    !Array.isArray(data.predictions) || data.predictions.length === 0) {\n                throw
    new Error('Unexpected response format from KServe. Expected {\"predictions\":
    [...]}.');\n            }\n\n            const classIndex = data.predictions[0];\n\n
    \           // 6. Map to species info\n            const speciesInfo = SPECIES_MAP[classIndex]
    || {\n                name: 'Unknown Species',\n                emoji: '❓',\n
    \               theme: ''\n            };\n\n            // 7. Update UI\n            document.body.classList.add(speciesInfo.theme);\n
    \           flowerIcon.textContent = speciesInfo.emoji;\n            speciesName.textContent
    = speciesInfo.name;\n            classIndexEl.textContent = classIndex;\n\n            resultCard.classList.remove('hidden');\n\n
    \       } catch (error) {\n            console.error('Prediction Failed:', error);\n
    \           errorMessage.textContent = error.message.includes('fetch')\n                ?
    'Network connection error (CORS or server down). Please check the backend.'\n
    \               : error.message;\n            errorBanner.classList.remove('hidden');\n
    \       } finally {\n            setLoading(false);\n        }\n    });\n});\n"
  index.html: "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n    <meta charset=\"UTF-8\">\n
    \   <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n
    \   <title>Iris Predictor (KServe)</title>\n    <!-- Use Google Fonts for better
    typography -->\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap\"
    rel=\"stylesheet\">\n    <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n\n<body>\n
    \   <div class=\"app-container\">\n        <!-- Header Section -->\n        <header
    class=\"header\">\n            <h1>Iris Predictor</h1>\n            <p>Classify
    Iris flowers using your KServe inference endpoint.</p>\n        </header>\n\n
    \       <!-- Main Input Form -->\n        <main class=\"main-content\">\n            <form
    id=\"predictionForm\" class=\"prediction-form\">\n\n                <div class=\"endpoint-section\">\n
    \                   <label for=\"apiUrl\">Backend Endpoint URL</label>\n                    <input
    type=\"url\" id=\"apiUrl\" placeholder=\"http://localhost:8011/v1/models/sklearn-iris:predict\"\n
    \                       required>\n                    <small>Enter the local
    proxy or full KServe V1/V2 predict URL.</small>\n                </div>\n\n                <div
    class=\"measurements-grid\">\n                    <div class=\"input-group\">\n
    \                       <label for=\"sepalLength\">Sepal Length (cm)</label>\n
    \                       <input type=\"number\" id=\"sepalLength\" step=\"0.1\"
    value=\"5.1\" min=\"0\" max=\"10\" required>\n                    </div>\n                    <div
    class=\"input-group\">\n                        <label for=\"sepalWidth\">Sepal
    Width (cm)</label>\n                        <input type=\"number\" id=\"sepalWidth\"
    step=\"0.1\" value=\"3.5\" min=\"0\" max=\"10\" required>\n                    </div>\n
    \                   <div class=\"input-group\">\n                        <label
    for=\"petalLength\">Petal Length (cm)</label>\n                        <input
    type=\"number\" id=\"petalLength\" step=\"0.1\" value=\"1.4\" min=\"0\" max=\"10\"
    required>\n                    </div>\n                    <div class=\"input-group\">\n
    \                       <label for=\"petalWidth\">Petal Width (cm)</label>\n                        <input
    type=\"number\" id=\"petalWidth\" step=\"0.1\" value=\"0.2\" min=\"0\" max=\"10\"
    required>\n                    </div>\n                </div>\n\n                <button
    type=\"submit\" id=\"submitBtn\" class=\"submit-btn\">\n                    <span>Predict
    Species</span>\n                    <div class=\"spinner hidden\" id=\"loadingSpinner\"></div>\n
    \               </button>\n            </form>\n\n            <!-- Result Card
    -->\n            <div id=\"resultCard\" class=\"result-card hidden\">\n                <div
    class=\"result-header\">\n                    <h2>Prediction Result</h2>\n                </div>\n
    \               <div class=\"result-body\">\n                    <div class=\"flower-icon\"
    id=\"flowerIcon\">\U0001F338</div>\n                    <h3 class=\"species-name\"
    id=\"speciesName\">Iris Setosa</h3>\n                    <p class=\"confidence\"
    id=\"confidenceData\">Predicted Class Index: <span id=\"classIndex\"></span></p>\n
    \               </div>\n            </div>\n\n            <!-- Error Banner -->\n
    \           <div id=\"errorBanner\" class=\"error-banner hidden\">\n                <p
    id=\"errorMessage\">An error occurred while connecting to the backend.</p>\n            </div>\n
    \       </main>\n    </div>\n\n    <!-- Application Logic -->\n    <script src=\"app.js\"></script>\n</body>\n\n</html>"
  style.css: |
    /* Base Variables & Theming */
    :root {
        /* Colors */
        --bg-color: #f3f4f6;
        --card-bg: #ffffff;
        --text-primary: #111827;
        --text-secondary: #4b5563;
        --accent-color: #6366f1;
        --accent-hover: #4f46e5;
        --error-bg: #fef2f2;
        --error-text: #991b1b;
        --border-color: #e5e7eb;

        /* Theme Overrides (Set dynamically by JS) */
        --theme-flower-light: var(--accent-color);
        --theme-flower-dark: var(--accent-hover);
        --theme-flower-bg: #e0e7ff;

        /* Shadows & Radii */
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        --radius: 12px;
    }

    /* Base Reset & Typography */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--theme-flower-bg);
        color: var(--text-primary);
        line-height: 1.5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        transition: background-color 0.5s ease; /* Smooth transition for theme change */
    }


    /* Specific Species Themes */
    body.theme-setosa {
        --theme-flower-light: #ec4899; /* Pink */
        --theme-flower-dark: #be185d;
        --theme-flower-bg: #fdf2f8;    /* Very light pink bg */
    }

    body.theme-versicolor {
        --theme-flower-light: #8b5cf6; /* Purple */
        --theme-flower-dark: #6d28d9;
        --theme-flower-bg: #f5f3ff;    /* Very light purple bg */
    }

    body.theme-virginica {
        --theme-flower-light: #eab308; /* Yellow/Gold */
        --theme-flower-dark: #a16207;
        --theme-flower-bg: #fefce8;    /* Very light yellow bg */
    }


    /* App Container */
    .app-container {
        background-color: var(--card-bg);
        width: 100%;
        max-width: 600px;
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
        overflow: hidden;
    }

    /* Header */
    .header {
        background: linear-gradient(135deg, var(--theme-flower-light), var(--theme-flower-dark));
        color: white;
        padding: 30px 20px;
        text-align: center;
        transition: background 0.5s ease;
    }

    .header h1 {
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: -0.025em;
    }

    .header p {
        font-size: 0.95rem;
        opacity: 0.9;
    }

    /* Main Content Area */
    .main-content {
        padding: 30px;
    }

    /* Forms and Inputs */
    .prediction-form {
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    .endpoint-section {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .measurements-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }

    @media (max-width: 480px) {
        .measurements-grid {
            grid-template-columns: 1fr;
        }
    }

    .input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    label {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-secondary);
    }

    input[type="url"],
    input[type="number"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-family: inherit;
        font-size: 1rem;
        color: var(--text-primary);
        transition: border-color 0.2s, box-shadow 0.2s;
        outline: none;
    }

    input[type="url"]:focus,
    input[type="number"]:focus {
        border-color: var(--theme-flower-light);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    small {
        font-size: 0.75rem;
        color: #6b7280;
    }

    /* Buttons */
    .submit-btn {
        background-color: var(--theme-flower-light);
        color: white;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        padding: 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
    }

    .submit-btn:hover {
        background-color: var(--theme-flower-dark);
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
    }

    .submit-btn:active {
        transform: translateY(0);
    }

    /* Loading Spinner */
    .spinner {
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* Utility / States */
    .hidden {
        display: none !important;
    }

    /* Result Card */
    .result-card {
        margin-top: 30px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        overflow: hidden;
        animation: slideUpFade 0.4s ease-out;
    }

    @keyframes slideUpFade {
        from {
            opacity: 0;
            transform: translateY(15px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .result-header {
        background-color: #f9fafb;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-color);
    }

    .result-header h2 {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-primary);
        margin: 0;
    }

    .result-body {
        padding: 24px;
        text-align: center;
    }

    .flower-icon {
        font-size: 4rem;
        line-height: 1;
        margin-bottom: 16px;
        animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .species-name {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--theme-flower-dark); /* Colorizes to match prediction */
        margin-bottom: 4px;
    }

    .confidence {
        font-size: 0.9rem;
        color: var(--text-secondary);
    }

    /* Error Banner */
    .error-banner {
        margin-top: 20px;
        background-color: var(--error-bg);
        color: var(--error-text);
        padding: 16px;
        border-radius: 8px;
        font-size: 0.9rem;
        border: 1px solid #fecaca;
        animation: slideUpFade 0.3s ease-out;
    }
kind: ConfigMap
metadata:
  name: frontend-files
  namespace: kserve-test
